apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app-green
  namespace: devsecops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app
      version: green

  template:
    metadata:
      labels:
        app: flask-app
        version: green

    spec:
      containers:
        - name: flask-app
          image: devsecops-flask-app:v2
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 5000
          
          env:
          - name: APP_VERSION
            value: "green"
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: ENVIRONMENT

          livenessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 5
