name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        working-directory: ./app
        run:
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: ./app
        run:
          pytest

      - name: Build Docker Image
        run:
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:${{ github.sha }} ./app
          docker tag ${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:latest

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: DockerHub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to DockerHub
        if: github.event_name == 'push'
        run:
          docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-flask-app:latest
